<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="css/style.css">
    <title>FORMULARIO DE REGISTRO E INICIO DE SESIÓN</title>
</head>
<body>
    <div class="container-form registre">
        <div class="formation">
            <div class="info-childs">
                <h2> Bienvenido</h2>
                <p>Para unirte a nuestra comunidad por favor Inicia Sesión con tus datos</p>
                <input type="button" value="Iniciar Sesión" id="sign-in">
            </div>
        </div>  
        <div class="form-information">
            <div class="form-imformation-childs">
                <h2>Crear una Cuenta</h2>
                <div class="icons">
                    <i class='bx bxl-google'></i>
                    <i class='bx bx-child'></i>
                    <i class='bx bxs-castle' ></i>
                </div>
                <p>o usa tu Gmail para registrarte </p>
                <form class="form" id="registerForm">
                    <div>
                        <label>
                            <i class='bx bx-user'></i>
                            <input type="text" id="nombre" placeholder="Nombre completo" required>
                        </label>
                    </div>
                    <div>
                        <label>
                            <i class='bx bx-user-pin'></i>
                            <input type="number" id="edad"  placeholder="Edad" required>
                        </label>
                    </div>
                    <div>
                        <label>
                            <i class='bx bx-calendar'></i>
                            <input type="text" id="fechaNacimiento" pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}" placeholder="FechaNacimiento(dd/mm/yyyy)" required>
                        </label>
                    </div>
                    <div>
                        <label>
                            <i class='bx bxl-gmail'></i>
                            <input type="email" id="Correo" placeholder="Correo Electrónico" required>
                            <span id="emailError" class="error"></span>
                        </label>
                    </div>
                    <div>
                        <label>
                            <i class='bx bx-lock-alt'></i>
                            <input type="password" id="Contraseña" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8}" placeholder="Contraseña" required>
                        </label>
                    </div>
                    <input type="submit" value="Registrarse">
                </form>
            </div>
        </div>  
    </div> 

    
    <div id="inicioSesion" class="container-form login hide">
        <div class="formation">
            <div class="info-childs">
                <h2> Bienvenido nuevamente</h2>
                <p>Para unirte a nuestra comunidad por favor Inicia Sesión con tus datos</p>
                <input type="button" value="Registrarse" id="sign-up">
            </div>
        </div>  
        <div id="loginContainer" class="form-information">
            <div class="form-imformation-childs">
                <h2>Inicia Sesión</h2>
                <div class="icons">
                    <i class='bx bxl-google'></i>
                    <i class='bx bx-child'></i>
                    <i class='bx bxs-castle' ></i>
                </div>
                <p>o Inicia Sesión con una cuenta  </p>
                <form class="form" id="loginForm">
                    <div>
                        <label>
                            <input type="email" id="username" placeholder="Correo Electrónico" required>
                        </label>
                    </div>
                    <div>
                        <label>
                            <input type="password" id="password" placeholder="Contraseña" required>
                        </label>
                    </div>
                    <input  id="btnIniciar"type="submit" value="Inicia Sesión">
                    <p id="loginMessage"></p>
                </form>
            </div>
        </div>  
    </div>
    <script src="js/script registro.js"></script>
    <script src="js/script inicio.js"></script>
</body>
</html>
